<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도로명 → 지번/PNU 매칭 도구</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="style.css">
<!-- 엑셀 읽기/쓰기 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.__XLSX_COMMUNITY = window.XLSX;</script>
<!--
  xlsx-js-style: 셀 배경색 등 스타일을 "쓸" 수 있는 SheetJS 포크.
  커뮤니티판 XLSX는 스타일 읽기는 되지만 쓰기는 지원하지 않는다(sheetjs#3214).
  결과 다운로드에서 "불일치" 행에 색을 칠하는 용도로만 쓴다. 같은 전역 이름
  (XLSX)을 쓰므로 로드 직후 window.XLSXStyle로 옮기고 커뮤니티판을 복원한다 —
  이 스크립트가 없거나 로드에 실패해도 나머지 기능은 그대로 동작하고, 색칠만
  조용히 생략된다.
-->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
  window.XLSXStyle = (window.XLSX !== window.__XLSX_COMMUNITY) ? window.XLSX : null;
  window.XLSX = window.__XLSX_COMMUNITY;
</script>
<!--
  카카오맵 JS SDK
  주의 1: appkey 를 카카오 디벨로퍼스에서 발급받은 "JavaScript 키"로 교체하세요.
  주의 2: [앱 > 플랫폼 키 > JavaScript 키 > JavaScript SDK 도메인]에 서비스 주소를 등록해야 합니다.
  주의 3: [제품 설정 > 카카오맵]이 활성화(ON)되어 있어야 합니다.
-->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e15236035f91c232bbfe80eb5d65e417&libraries=services"></script>
<!-- 주소 파싱 · PNU 조립 (순수 모듈, test.html 로 검증됨) -->
<script src="src/address.js"></script>
<script src="src/pnu.js"></script>
</head>
<body>
<header>
  <h1>도로명 → 지번/PNU 매칭 도구</h1>
  <p class="sub">엑셀 업로드 → 도로명주소 기준으로 지번주소·PNU 조회 → 기존 지번과 일치 여부 확인 → 엑셀 다운로드</p>
</header>

<!-- 시스템 전환 메뉴: 지오코딩 / 도로명-지번 매칭은 이제 완전히 분리된 두 페이지다. -->
<nav class="app-switch" aria-label="시스템 선택">
  <a href="index.html">📍 주소 지오코딩</a>
  <a href="address-match.html" class="active">🔎 도로명 → 지번/PNU 매칭</a>
</nav>

<main>
  <!-- 1단계: 파일 업로드 -->
  <section class="card" id="step-upload">
    <h2><span class="step-badge">1</span> 엑셀 업로드</h2>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <div id="uploadStatus" class="status"></div>
  </section>

  <!-- 2단계: 시트 선택 -->
  <section class="card hidden" id="step-sheets">
    <h2><span class="step-badge">2</span> 시트 선택</h2>
    <div class="field">
      <label>처리할 시트 (여러 개 선택 가능)</label>
      <label class="checkbox"><input type="checkbox" id="sheetAll"> 전체 선택 / 해제</label>
      <div id="sheetList" class="sheet-list"></div>
      <div id="sheetMapNote" class="status"></div>
    </div>
  </section>

  <!-- 3단계: 컬럼 지정 + 실행 -->
  <section class="card hidden" id="step-pnu">
    <h2><span class="step-badge">3</span> 컬럼 지정 및 실행</h2>
    <p class="hint">
      도로명주소는 정확한데 지번주소가 부정확하거나 모호할 때, 도로명주소를 기준으로
      카카오 API에서 지번주소와 PNU(19자리 필지고유번호)를 뽑아 새 컬럼에 기록합니다.
      좌표(X, Y)는 다루지 않습니다.
    </p>
    <div class="grid2">
      <div class="field">
        <label>도로명주소 컬럼</label>
        <select id="pnuColRoad"></select>
      </div>
      <div class="field">
        <label>기존 지번주소 컬럼 <span class="badge">선택 — 일치 여부 비교용</span></label>
        <select id="pnuColJibun"><option value="">(없음)</option></select>
      </div>
      <div class="field" style="max-width:280px">
        <label>동시 처리 수 (빠르지만 너무 높이면 오류가 늘 수 있음)</label>
        <select id="concurrency">
          <option value="1">1 (가장 안전, 느림)</option>
          <option value="3">3</option>
          <option value="6" selected>6 (권장)</option>
          <option value="10">10 (가장 빠름)</option>
        </select>
      </div>
    </div>
    <div id="pnuNote" class="status"></div>
    <button id="pnuStartBtn">변환 실행</button>
    <button id="pnuStopBtn" class="danger" disabled>중지</button>

    <div id="pnuProgressWrap" class="hidden">
      <div id="pnuProgressText" class="status">0 / 0</div>
      <div id="pnuBreakerWarning" class="status warn hidden"></div>
    </div>

    <div id="pnuFailWrap" class="hidden">
      <h3>실패 목록 <span id="pnuFailBadge" class="badge"></span></h3>
      <ul id="pnuFailList" class="fail-list"></ul>
    </div>

    <div id="pnuDownloadWrap" class="hidden">
      <button id="pnuDownloadBtn">지번/PNU 결과 다운로드</button>
    </div>
  </section>
</main>

<script src="src/core.js"></script>
<script src="pnu-app.js"></script>
</body>
</html>
